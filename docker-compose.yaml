name: assester

services:
  postgres:
    image: postgres:17
    container_name: assester-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootroot}
      POSTGRES_DB: ${POSTGRES_DB:-assester}
      TZ: Europe/Kyiv
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assester}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assester-app
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/assester}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rootroot}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      MATERIAL_STORAGE_LOCATION: ${MATERIAL_STORAGE_LOCATION:-/app/uploads/materials}
      JWT_SECRET: ${JWT_SECRET:-0f41b1d9269bdbfb3fe50da4f10b78804c6004fec5ace2114eee5efce5ed9cb4}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AUTH_TOKEN_NAME: ${AUTH_TOKEN_NAME:-AUTH_TOKEN}
      JWT_SECURE_COOKIE: ${JWT_SECURE_COOKIE:-false}
      TZ: Europe/Kyiv
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: assester-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: assester-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: assester-promtail
    volumes:
      - ./promtail.yaml:/etc/promtail/promtail.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: assester-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring

volumes:
  postgres_data:

networks:
  monitoring:
    driver: bridge