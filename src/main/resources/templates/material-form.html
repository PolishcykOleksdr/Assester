<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share a material — Assester</title><link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<main class="container page-container">
    <nav class="navbar"><a th:href="@{/}" class="brand">Assester</a><div class="actions"><a th:href="@{/materials}">Materials</a><a th:href="@{/my/materials}">My materials</a></div></nav>
    <section class="editor-layout">
        <header class="editor-heading"><h1>Share a material</h1><p>Publish files for others to find and download. You can attach up to five files.</p></header>
        <form class="editor-form surface" th:action="@{/my/materials}" th:object="${materialForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
            <div class="form-group"><label for="title">Title</label><input id="title" type="text" th:field="*{title}" maxlength="120" required><small class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small></div>
            <div class="form-group"><label for="description">Description</label><textarea id="description" th:field="*{description}" rows="5" maxlength="3000" required></textarea><small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div>
            <div class="form-group"><label for="files">Files (PDF, PowerPoint, Word, text, or images; up to 25 MB each)</label><input id="files" name="files" type="file" multiple required accept=".pdf,.ppt,.pptx,.odp,.doc,.docx,.odt,.txt,.png,.jpg,.jpeg"></div>
            <button class="btn" type="submit">Publish material</button>
        </form>
        <a th:href="@{/my/materials}" class="editor-back">Back to my materials</a>
    </section>
</main>
</body>
</html>
