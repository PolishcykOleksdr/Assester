<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Assester</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="container" style="max-width: 700px;">
        <div class="navbar">
            <a th:href="@{/}" class="brand">Assester</a>
            <div class="actions">
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}">Register</a>
            </div>
        </div>

        <div class="card hero">
            <h2>Welcome to Assester</h2>
            <p>Please sign in or create an account to get started.</p>
             <a th:href="@{/login}" class="btn">Sign In</a>
            <a th:href="@{/register}" class="btn btn-secondary">Create Account</a>
        </div>
    </div>
</body>
</html>
