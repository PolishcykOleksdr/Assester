<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Assester</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="container">
        <div class="card error-card">
            <div class="error-code" th:text="${status} ?: 'ERROR'">500</div>
            <h1 th:text="${error} ?: 'Something went wrong'">Internal Server Error</h1>
            <p class="subtitle" th:if="${message}" th:text="${message}">Unexpected error</p>
            <p class="subtitle" th:unless="${message}">
                An unexpected error occurred while processing your request.
            </p>

            <div class="error-meta" th:if="${path} or ${timestamp}">
                <span th:if="${path}" class="error-path" th:text="${path}">/path</span>
                <span th:if="${timestamp}" class="error-time"
                      th:text="${#temporals.format(timestamp, 'dd.MM.yyyy HH:mm:ss')}">01.01.2026 00:00:00</span>
            </div>

            <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
