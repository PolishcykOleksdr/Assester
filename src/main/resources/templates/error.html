<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102d36">
    <title>Error — Assester</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="status-page">
<main class="status-panel" aria-labelledby="errorTitle">
    <span class="status-symbol" aria-hidden="true">
        <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 9v4m0 4h.01"/>
                    <path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3l-7.5-13.1a2 2 0 0 0-3.4 0Z"/>
                </svg>
    </span>
    <div class="error-code" th:text="${status} ?: 'ERROR'">500</div>
    <h1 id="errorTitle" th:text="${error} ?: 'Something went wrong'">Internal Server Error</h1>
    <p th:if="${message}" th:text="${message}">Unexpected error</p>
    <p th:unless="${message}">An unexpected error occurred while processing your request.</p>

    <div class="error-meta" th:if="${path} or ${timestamp}">
        <span th:if="${path}" class="error-path" th:text="${path}">/path</span>
        <span th:if="${timestamp}" class="error-time"
              th:text="${#temporals.format(timestamp, 'dd.MM.yyyy HH:mm:ss')}">01.01.2026 00:00:00</span>
    </div>

    <a th:href="@{/}" class="btn">Back to home</a>
</main>
</body>
</html>
