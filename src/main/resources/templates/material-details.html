<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="|${material.title} — Assester|">Material — Assester</title><link rel="stylesheet" th:href="@{/css/main.css}"></head>
<body><main class="container page-container">
    <nav class="navbar"><a th:href="@{/}" class="brand">Assester</a><div class="actions"><a th:href="@{/materials}">Material library</a><a th:href="@{/catalog}">Course catalog</a></div></nav>
    <section class="editor-layout"><header class="editor-heading"><span class="course-code" th:text="|Share code: ${material.materialCode}|">MAT-1234ABCD</span><h1 th:text="${material.title}">Material title</h1><p th:text="${material.description}">Description</p><p class="subtitle" th:text="|Shared by ${material.authorName}|">Author</p></header>
        <section class="workspace-list" aria-label="Attached files"><article class="course-row" th:each="file : ${files}"><div class="course-main"><h2 th:text="${file.originalName}">Presentation.pdf</h2><p class="course-description" th:text="|${#numbers.formatDecimal(file.sizeBytes / 1048576.0, 1, 2)} MB|">Size</p></div><div class="course-actions"><a class="btn compact-btn" th:href="@{/materials/{materialId}/files/{fileId}(materialId=${material.id},fileId=${file.id})}">Download</a></div></article></section>
        <a th:href="@{/materials}" class="editor-back">Back to materials</a>
    </section>
</main></body>
</html>
