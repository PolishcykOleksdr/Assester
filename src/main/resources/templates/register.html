<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Assester</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Create Account</h1>
            <p class="subtitle">Fill in your details to get started</p>

            <div th:if="${param.error}" class="alert alert-error">
                <span th:text="${param.error}">Error message</span>
            </div>

            <form th:action="@{/register/register}" th:method="post" th:object="${registerUserDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           placeholder="Enter your first name"
                           autocomplete="given-name"
                           required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           placeholder="Enter your last name"
                           autocomplete="family-name"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="Enter your email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}"
                           placeholder="Create a password (min 6 characters)"
                           autocomplete="new-password"
                           required minlength="6">
                </div>

                <button type="submit" class="btn">Create Account</button>
            </form>

            <a th:href="@{/login/login}" class="link">Already have an account? Sign In</a>
        </div>
    </div>
</body>
</html>
