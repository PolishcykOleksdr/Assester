spring:
  application:
    name: Assester
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/assester}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:rootroot}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MATERIAL_MAX_FILE_SIZE:25MB}
      max-request-size: ${MATERIAL_MAX_REQUEST_SIZE:125MB}

server:
  port: ${APP_PORT:8080}

assester:
  material-storage-location: ${MATERIAL_STORAGE_LOCATION:uploads/materials}

jwt:
  secret: ${JWT_SECRET:0f41b1d9269bdbfb3fe50da4f10b78804c6004fec5ace2114eee5efce5ed9cb4}
  expiration: ${JWT_EXPIRATION:86400000}
  token-name: ${AUTH_TOKEN_NAME:AUTH_TOKEN}
  secure-cookie: ${JWT_SECURE_COOKIE:false}
