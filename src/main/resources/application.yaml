spring:
  application:
    name: Assester
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/assester}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:rootroot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MATERIAL_MAX_FILE_SIZE:25MB}
      max-request-size: ${MATERIAL_MAX_REQUEST_SIZE:125MB}
  output:
    ansi:
      enabled: never

server:
  port: ${APP_PORT:8080}

assester:
  material-storage-location: ${MATERIAL_STORAGE_LOCATION:uploads/materials}

jwt:
  secret: ${JWT_SECRET:0f41b1d9269bdbfb3fe50da4f10b78804c6004fec5ace2114eee5efce5ed9cb4}
  expiration: ${JWT_EXPIRATION:86400000}
  token-name: ${AUTH_TOKEN_NAME:AUTH_TOKEN}
  secure-cookie: ${JWT_SECURE_COOKIE:false}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      access: unrestricted
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %msg%n"
